<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle</title>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
            font-family: 'Chewy', cursive;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            padding: 14px 12px 0;
            box-sizing: border-box;
            min-height: 100vh;
            gap: 10px;
        }
        
        h1 {
            font-size: clamp(56px, 8vw, 96px);
            margin: 0 0 6px 0;
            position: relative;
            z-index: 2;
            color: #7a6a97;
            text-align: center;
            line-height: 0.95;
        }
        
        @keyframes titleWave {
            0% { transform: translateY(0) rotateZ(-1deg); }
            25% { transform: translateY(-8px) rotateZ(1.5deg); }
            50% { transform: translateY(0) rotateZ(-1deg); }
            75% { transform: translateY(-8px) rotateZ(1.5deg); }
            100% { transform: translateY(0) rotateZ(-1deg); }
        }
        
        .wave-letter {
            display: inline-block;
            animation: titleWave 2.5s ease-in-out infinite;
        }
        
        .back-btn {
            padding: 8px 16px;
            background-color: #b0d4f1;
            color: #2d5aa3;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-family: 'Chewy', cursive;
            margin-top: 0;
        }
        
        .back-btn:hover {
            background-color: #7db8e8;
        }
        
        .wordle-grid {
            display: grid;
            grid-template-columns: repeat(5, 54px);
            gap: 8px;
            margin-top: 0;
        }
        
        .wordle-cell {
            width: 54px;
            height: 54px;
            border: 2px solid #7a6a97;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            background-color: #f0f0f0;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }
        
        .wordle-cell.correct {
            background-color: #6ee7b7;
            border-color: #10b981;
        }
        
        .wordle-cell.partial {
            background-color: #fbbf24;
            border-color: #f59e0b;
        }
        
        .wordle-cell.incorrect {
            background-color: #d1d5db;
            border-color: #9ca3af;
        }
        
        .game-controls {
            margin-top: 14px;
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .keyboard {
            margin-top: 10px;
            padding: 12px 10px 18px;
            width: min(100%, 760px);
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: center;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 5px;
            width: 100%;
        }

        .keyboard-key {
            min-width: 42px;
            height: 48px;
            padding: 0 10px;
            border: 2px solid #7a6a97;
            border-radius: 10px;
            background-color: #fff7fb;
            color: #6b5b7f;
            font-family: 'Chewy', cursive;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.12s ease, background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .keyboard-key:hover {
            transform: translateY(-1px);
            background-color: #f4e9ff;
        }

        .keyboard-key.wide {
            min-width: 72px;
        }

        .keyboard-key.correct {
            background-color: #6ee7b7;
            border-color: #10b981;
            color: #0f5132;
        }

        .keyboard-key.partial {
            background-color: #fbbf24;
            border-color: #f59e0b;
            color: #7c2d12;
        }

        .keyboard-key.incorrect {
            background-color: #d1d5db;
            border-color: #9ca3af;
            color: #4b5563;
        }

        .keyboard-key:disabled {
            cursor: pointer;
            opacity: 1;
        }
        
        .submit-btn {
            padding: 8px 16px;
            background-color: #c9b8f5;
            color: #7a6a97;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Chewy', cursive;
            cursor: pointer;
        }
        
        .submit-btn:hover {
            background-color: #b5a0ef;
        }
        
        .submit-btn:disabled {
            background-color: #d1d5db;
            cursor: not-allowed;
        }
        
        .message {
            margin-top: 10px;
            font-size: 20px;
            color: #7a6a97;
            text-align: center;
            min-height: 26px;
        }
        
        .answer-reveal {
            margin-top: 6px;
            font-size: 18px;
            color: #d63af9;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .container {
                padding-top: 12px;
            }

            h1 {
                font-size: clamp(44px, 13vw, 72px);
            }

            .wordle-grid {
                grid-template-columns: repeat(5, 48px);
                gap: 6px;
            }

            .wordle-cell {
                width: 48px;
                height: 48px;
                font-size: 24px;
            }

            .keyboard {
                width: 100%;
                padding: 10px 6px 14px;
            }

            .keyboard-row {
                gap: 4px;
            }

            .keyboard-key {
                min-width: 34px;
                height: 40px;
                padding: 0 7px;
                font-size: 15px;
            }

            .keyboard-key.wide {
                min-width: 58px;
            }

            .game-controls {
                gap: 12px;
                margin-top: 10px;
            }

            .submit-btn {
                padding: 7px 12px;
                font-size: 15px;
            }

            .back-btn {
                font-size: 14px;
                padding: 7px 12px;
            }

            .message {
                font-size: 18px;
            }

            .answer-reveal {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="window.location.href = '/'">← Back to Tic Tac Toe</button>
        <h1>
            <span class="wave-letter" style="animation-delay: -0.2s">🍦</span>
            <span class="wave-letter" style="animation-delay: -0.1s">🍦</span>
            &nbsp;
            <span class="wave-letter" style="animation-delay: 0s">A</span>
            <span class="wave-letter" style="animation-delay: 0.1s">l</span>
            <span class="wave-letter" style="animation-delay: 0.2s">e</span>
            <span class="wave-letter" style="animation-delay: 0.3s">x</span>
            <span class="wave-letter" style="animation-delay: 0.4s">'s</span>
            &nbsp;
            <span class="wave-letter" style="animation-delay: 0.6s">G</span>
            <span class="wave-letter" style="animation-delay: 0.7s">a</span>
            <span class="wave-letter" style="animation-delay: 0.8s">m</span>
            <span class="wave-letter" style="animation-delay: 0.9s">e</span>
            <span class="wave-letter" style="animation-delay: 1s">s</span>
            &nbsp;
            <span class="wave-letter" style="animation-delay: 1.1s">🍦</span>
            <span class="wave-letter" style="animation-delay: 1.2s">🍦</span>
        </h1>
        
        <div class="wordle-grid" id="wordleGrid"></div>
        
        <div class="game-controls">
            <button class="submit-btn" id="submitBtn" onclick="submitGuess()">Submit</button>
            <button class="submit-btn" onclick="resetGame()">Reset</button>
        </div>
        
        <div class="message" id="message"></div>
        <div class="answer-reveal" id="answerReveal"></div>

        <div class="keyboard" id="keyboard"></div>
    </div>

    <script src="./wordbank-new.js"></script>

    <script>

        let answer = '';
        let currentRow = 0;
        let gameOver = false;
        let won = false;
        let guessedWords = new Set();
        let keyboardState = {};

        const keyboardRows = [
            ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
            ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
            ['ENTER', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', 'BACK']
        ];

        const keyboardPriority = {
            incorrect: 1,
            partial: 2,
            correct: 3
        };

        function initGame() {
            answer = WORD_BANK[Math.floor(Math.random() * WORD_BANK.length)].toUpperCase().trim();
            currentRow = 0;
            gameOver = false;
            won = false;
            guessedWords = new Set();
            keyboardState = {};
            document.getElementById('message').textContent = '';
            document.getElementById('answerReveal').textContent = '';
            document.getElementById('submitBtn').disabled = false;
            createGrid();
            createKeyboard();
        }

        function createGrid() {
            const grid = document.getElementById('wordleGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 30; i++) {
                const cell = document.createElement('div');
                cell.className = 'wordle-cell';
                cell.id = `cell-${i}`;
                cell.textContent = '';
                grid.appendChild(cell);
            }
        }

        function getCurrentRowCells() {
            const cells = [];
            for (let i = 0; i < 5; i++) {
                cells.push(document.getElementById(`cell-${currentRow * 5 + i}`));
            }
            return cells;
        }

        function getInputLetters() {
            const cells = getCurrentRowCells();
            return cells.map(cell => cell.textContent).join('');
        }

        function createKeyboard() {
            const keyboard = document.getElementById('keyboard');
            keyboard.innerHTML = '';

            keyboardRows.forEach(row => {
                const rowElement = document.createElement('div');
                rowElement.className = 'keyboard-row';

                row.forEach(key => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'keyboard-key';
                    button.id = `key-${key}`;
                    button.textContent = key === 'BACK' ? '⌫' : key;

                    if (key === 'ENTER' || key === 'BACK') {
                        button.classList.add('wide');
                    }

                    button.addEventListener('click', () => handleKeyboardInput(key));
                    rowElement.appendChild(button);
                });

                keyboard.appendChild(rowElement);
            });

            syncKeyboardColors();
        }

        function handleKeyboardInput(key) {
            if (gameOver) return;

            const cells = getCurrentRowCells();
            const inputLength = getInputLetters().length;

            if (key === 'BACK') {
                if (inputLength > 0) {
                    cells[inputLength - 1].textContent = '';
                    validateCurrentInput();
                }
                return;
            }

            if (key === 'ENTER') {
                submitGuess();
                return;
            }

            if (key.length === 1 && inputLength < 5) {
                cells[inputLength].textContent = key;
                validateCurrentInput();
            }
        }

        function setKeyboardState(letter, status) {
            const existing = keyboardState[letter];
            if (!existing || keyboardPriority[status] > keyboardPriority[existing]) {
                keyboardState[letter] = status;
            }
        }

        function syncKeyboardColors() {
            Object.entries(keyboardState).forEach(([letter, status]) => {
                const button = document.getElementById(`key-${letter}`);
                if (!button) return;
                button.classList.remove('correct', 'partial', 'incorrect');
                button.classList.add(status);
            });
        }

        function validateCurrentInput() {
            const guess = getInputLetters().toUpperCase().trim();
            
            if (guess.length === 5) {
                // Check if it's a valid word
                if (!VALID_WORDS.has(guess)) {
                    document.getElementById('message').textContent = 'Not a valid word!';
                    return false;
                }

                // Check if word has already been guessed
                if (guessedWords.has(guess)) {
                    document.getElementById('message').textContent = "You've already guessed this!";
                    return false;
                }

                document.getElementById('message').textContent = '';
                return true;
            } else if (guess.length < 5) {
                document.getElementById('message').textContent = '';
            }
            return true;
        }

        function submitGuess() {
            if (gameOver) return;

            const guess = getInputLetters().toUpperCase().trim();
            if (guess.length !== 5) {
                document.getElementById('message').textContent = 'Please enter 5 letters!';
                return;
            }

            // Validate before submitting
            if (!validateCurrentInput()) {
                // Clear the cells
                getCurrentRowCells().forEach(cell => cell.textContent = '');
                return;
            }

            guessedWords.add(guess);

            const cells = getCurrentRowCells();
            const answerArray = answer.split('');
            const guessArray = guess.split('');
            const result = new Array(5).fill('incorrect');

            // First pass: mark correct positions
            for (let i = 0; i < 5; i++) {
                if (guessArray[i] === answerArray[i]) {
                    result[i] = 'correct';
                    answerArray[i] = null;
                    guessArray[i] = null;
                }
            }

            // Second pass: mark partial matches
            for (let i = 0; i < 5; i++) {
                if (guessArray[i] !== null && answerArray.includes(guessArray[i])) {
                    result[i] = 'partial';
                    answerArray[answerArray.indexOf(guessArray[i])] = null;
                }
            }

            // Apply colors
            cells.forEach((cell, index) => {
                cell.classList.add(result[index]);
                setKeyboardState(guess[index], result[index]);
            });

            syncKeyboardColors();

            // Check if won
            if (guess === answer) {
                won = true;
                gameOver = true;
                document.getElementById('message').textContent = '🎉 You Won! 🎉';
                document.getElementById('submitBtn').disabled = true;
                celebrateWin();
                return;
            }

            // Check if lost
            if (currentRow === 5) {
                gameOver = true;
                document.getElementById('message').textContent = 'Game Over! Better luck next time.';
                document.getElementById('answerReveal').textContent = `The answer was: ${answer}`;
                document.getElementById('submitBtn').disabled = true;
                return;
            }

            currentRow++;
            document.getElementById('message').textContent = '';
        }

        function celebrateWin() {
            const sprinkle = confetti.shapeFromPath({ path: 'M-8,-2 L8,-2 L8,2 L-8,2 Z' });
            const emojiShape = confetti.shapeFromText({ text: '🍩', scalar: 7 });

            confetti({
                particleCount: 300,
                spread: 160,
                origin: { y: 0.4 },
                shapes: [sprinkle, emojiShape],
                colors: ['#e87dd8', '#a78bfa', '#6ee7b7', '#f472b6', '#818cf8', '#fb923c'],
                scalar: 3.5,
                startVelocity: 55,
                ticks: 200,
            });

            setTimeout(() => confetti({
                particleCount: 150,
                spread: 120,
                origin: { x: 0.1, y: 0.6 },
                shapes: [sprinkle, emojiShape],
                colors: ['#e87dd8', '#a78bfa', '#6ee7b7', '#f472b6', '#818cf8', '#fb923c'],
                scalar: 3,
            }), 200);

            setTimeout(() => confetti({
                particleCount: 150,
                spread: 120,
                origin: { x: 0.9, y: 0.6 },
                shapes: [sprinkle, emojiShape],
                colors: ['#e87dd8', '#a78bfa', '#6ee7b7', '#f472b6', '#818cf8', '#fb923c'],
                scalar: 3,
            }), 200);
        }

        function resetGame() {
            initGame();
        }

        document.addEventListener('keydown', (e) => {
            if (gameOver) return;

            if (e.key === 'Backspace' || e.key === 'Enter') {
                e.preventDefault();
            }

            if (e.key === 'Backspace') {
                handleKeyboardInput('BACK');
            } else if (e.key === 'Enter') {
                handleKeyboardInput('ENTER');
            } else if (/^[A-Za-z]$/.test(e.key)) {
                handleKeyboardInput(e.key.toUpperCase());
            }
        });

        // Initialize game on load
        initGame();
    </script>
</body>
</html>
